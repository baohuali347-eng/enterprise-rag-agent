[project]
name = "enterprise-rag-agent"
version = "0.1.0"
description = "基于 LangChain + LangGraph 的企业知识库问答 Agent（飞书帮助中心语料）"
readme = "README.md"
authors = [
    { name = "zld", email = "3372854537@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "jieba>=0.42.1",
    "langchain-core>=1.6.9",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "loguru>=0.7.3",
    "lxml>=6.1.3",
    "markdownify>=1.2.3",
    "modelscope>=1.40.2",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
    "tqdm>=4.70.1",
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
